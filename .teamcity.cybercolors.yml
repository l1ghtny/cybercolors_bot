jobs:
  build_backend:
    name: 1. Build Backend Image
    runs-on: self-hosted
    steps:
      - type: script
        name: Docker build and push backend
        script-content: |-
          #!/bin/bash
          set -euo pipefail

          if [ -n "${DOCKER_HOST:-}" ]; then
            PUSH_REGISTRY="registry.container-registry.svc.cluster.local:5000"
          else
            PUSH_REGISTRY="localhost:32000"
          fi

          IMAGE="$PUSH_REGISTRY/cybercolors-backend"
          TAG="%build.number%"

          push_with_retry() {
            local image="$1"
            local attempt
            local delay=2

            for attempt in 1 2 3 4 5; do
              if docker push "$image"; then
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push $image after $attempt attempts." >&2
                return 1
              fi
              echo "Push attempt $attempt for $image failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          rm -rf cybercolors_bot
          git clone --depth 1 --branch master https://github.com/l1ghtny/cybercolors_bot.git cybercolors_bot
          cd cybercolors_bot
          docker build -f docker/Dockerfile -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          push_with_retry "$IMAGE:$TAG"
          push_with_retry "$IMAGE:latest"
    repositories:
      - main:
          enabled: false

  build_indexer:
    name: 2. Build Indexer Image
    runs-on: self-hosted
    steps:
      - type: script
        name: Docker build and push indexer
        script-content: |-
          #!/bin/bash
          set -euo pipefail

          if [ -n "${DOCKER_HOST:-}" ]; then
            PUSH_REGISTRY="registry.container-registry.svc.cluster.local:5000"
          else
            PUSH_REGISTRY="localhost:32000"
          fi

          IMAGE="$PUSH_REGISTRY/cybercolors-indexer"

          push_with_retry() {
            local image="$1"
            local attempt
            local delay=2

            for attempt in 1 2 3 4 5; do
              if docker push "$image"; then
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push $image after $attempt attempts." >&2
                return 1
              fi
              echo "Push attempt $attempt for $image failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          rm -rf cybercolors_bot
          git clone --depth 1 --branch master https://github.com/l1ghtny/cybercolors_bot.git cybercolors_bot
          cd cybercolors_bot

          INDEXER_HASH="$(
            git ls-files \
              docker/Dockerfile.indexer \
              pyproject.toml \
              uv.lock \
              scripts/run_ai_knowledge_worker.py \
              scripts/run_youtube_channel_worker.py \
              src/__init__.py \
              src/db \
              src/modules/__init__.py \
              src/modules/ai \
              src/modules/observability \
            | sort \
            | xargs sha256sum \
            | sha256sum \
            | cut -c1-16
          )"
          TAG="idx-$INDEXER_HASH"

          if docker manifest inspect --insecure "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "Indexer image $IMAGE:$TAG already exists; skipping build."
            exit 0
          fi

          docker build -f docker/Dockerfile.indexer -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          push_with_retry "$IMAGE:$TAG"
          push_with_retry "$IMAGE:latest"
    repositories:
      - main:
          enabled: false

  build_embeddings:
    name: 3. Build Embeddings Image
    runs-on: self-hosted
    steps:
      - type: script
        name: Docker build and push embeddings
        script-content: |-
          #!/bin/bash
          set -euo pipefail

          if [ -n "${DOCKER_HOST:-}" ]; then
            PUSH_REGISTRY="registry.container-registry.svc.cluster.local:5000"
          else
            PUSH_REGISTRY="localhost:32000"
          fi

          IMAGE="$PUSH_REGISTRY/cybercolors-embeddings"

          push_with_retry() {
            local image="$1"
            local attempt
            local delay=2

            for attempt in 1 2 3 4 5; do
              if docker push "$image"; then
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push $image after $attempt attempts." >&2
                return 1
              fi
              echo "Push attempt $attempt for $image failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          rm -rf cybercolors_bot
          git clone --depth 1 --branch master https://github.com/l1ghtny/cybercolors_bot.git cybercolors_bot
          cd cybercolors_bot

          EMBEDDINGS_HASH="$(
            git ls-files \
              docker/Dockerfile.embeddings \
              pyproject.toml \
              uv.lock \
              src/__init__.py \
              src/modules/__init__.py \
              src/modules/ai/__init__.py \
              src/modules/ai/embedding_service.py \
              src/modules/ai/embeddings.py \
              src/modules/observability/prometheus.py \
            | sort \
            | xargs sha256sum \
            | sha256sum \
            | cut -c1-16
          )"
          TAG="emb-$EMBEDDINGS_HASH"

          if docker manifest inspect --insecure "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "Embeddings image $IMAGE:$TAG already exists; skipping build."
            exit 0
          fi

          docker build -f docker/Dockerfile.embeddings -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          push_with_retry "$IMAGE:$TAG"
          push_with_retry "$IMAGE:latest"
    repositories:
      - main:
          enabled: false

  build_frontend:
    name: 4. Build Frontend Image
    runs-on: self-hosted
    steps:
      - type: script
        name: Docker build and push frontend
        script-content: |-
          #!/bin/bash
          set -euo pipefail

          CHECKOUT_DIR="%teamcity.build.checkoutDir%"
          if [ -f "$CHECKOUT_DIR/package.json" ]; then
            FRONTEND_DIR="$CHECKOUT_DIR"
          elif [ -f "$CHECKOUT_DIR/bot-command-center/package.json" ]; then
            FRONTEND_DIR="$CHECKOUT_DIR/bot-command-center"
          else
            echo "Frontend checkout is missing from $CHECKOUT_DIR and $CHECKOUT_DIR/bot-command-center" >&2
            exit 1
          fi
          cd "$FRONTEND_DIR"
          echo "Building frontend revision $(git rev-parse HEAD) from $FRONTEND_DIR"

          if [ -n "${DOCKER_HOST:-}" ]; then
            PUSH_REGISTRY="registry.container-registry.svc.cluster.local:5000"
          else
            PUSH_REGISTRY="localhost:32000"
          fi

          IMAGE="$PUSH_REGISTRY/cybercolors-frontend"
          TAG="%build.number%"

          push_with_retry() {
            local image="$1"
            local attempt
            local delay=2

            for attempt in 1 2 3 4 5; do
              if docker push "$image"; then
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push $image after $attempt attempts." >&2
                return 1
              fi
              echo "Push attempt $attempt for $image failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          cat > Dockerfile <<'DOCKERFILE'
          FROM node:22-alpine AS build
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci
          COPY . .
          RUN npm run build

          FROM nginx:1.27-alpine
          COPY --from=build /app/dist /usr/share/nginx/html
          RUN cat > /etc/nginx/conf.d/default.conf <<'NGINX'
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            location /assets/ {
              add_header Cache-Control "public, max-age=31536000, immutable";
              try_files $uri =404;
            }

            location / {
              add_header Cache-Control "no-store, no-cache, must-revalidate";
              try_files $uri $uri/ /index.html;
            }
          }
          NGINX
          DOCKERFILE

          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          push_with_retry "$IMAGE:$TAG"
          push_with_retry "$IMAGE:latest"
    repositories:
      - CyberColors_FrontendGit:
          path: bot-command-center
          enabled: true

  run_migrations:
    name: 5. Run Alembic Migrations
    runs-on: self-hosted
    dependencies:
      - build_backend
    steps:
      - type: script
        name: Run migration job in Kubernetes
        script-content: |-
          #!/bin/bash
          set -euo pipefail

          ensure_kubectl() {
            if command -v kubectl >/dev/null 2>&1; then
              return
            fi
            BIN_DIR="${HOME:-/tmp}/.local/bin"
            mkdir -p "$BIN_DIR"
            curl -fsSLo "$BIN_DIR/kubectl" "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x "$BIN_DIR/kubectl"
            export PATH="$BIN_DIR:$PATH"
          }

          ensure_kubectl

          BACKEND_TAG="%job.build_backend.build.number%"
          JOB_NAME="cybercolors-migration-$BACKEND_TAG"

          kubectl -n cybercolors delete job "$JOB_NAME" --ignore-not-found=true
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $JOB_NAME
            namespace: cybercolors
          spec:
            backoffLimit: 1
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migration
                    image: localhost:32000/cybercolors-backend:$BACKEND_TAG
                    imagePullPolicy: Always
                    command: ["alembic", "upgrade", "head"]
                    envFrom:
                      - configMapRef:
                          name: cybercolors-config
                      - secretRef:
                          name: cybercolors-app-secrets
                          optional: true
                    env:
                      - name: DB_USER
                        valueFrom:
                          secretKeyRef:
                            name: cybercolors-db-pguser-backend
                            key: user
                      - name: DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: cybercolors-db-pguser-backend
                            key: password
          YAML

          migration_container_logs() {
            local pod pod_started

            while IFS= read -r pod; do
              [ -n "$pod" ] || continue
              pod_started="$(
                kubectl -n cybercolors get "$pod" \
                  -o jsonpath='{.status.containerStatuses[?(@.name=="migration")].state.running.startedAt}{.status.containerStatuses[?(@.name=="migration")].state.terminated.finishedAt}' \
                  2>/dev/null || true
              )"

              if [ -n "$pod_started" ]; then
                kubectl -n cybercolors logs "$pod" -c migration --tail=200 || true
              else
                echo "Logs unavailable for $pod: migration container has not started."
              fi
            done < <(
              kubectl -n cybercolors get pods -l "job-name=$JOB_NAME" -o name 2>/dev/null || true
            )
          }

          MIGRATION_RESULT="timeout"
          for i in $(seq 1 600); do
            JOB_CONDITIONS="$(
              kubectl -n cybercolors get "job.batch/$JOB_NAME" \
                -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}|{.status.conditions[?(@.type=="Failed")].status}' \
                2>/dev/null || true
            )"
            JOB_COMPLETE="${JOB_CONDITIONS%%|*}"
            JOB_FAILED="${JOB_CONDITIONS#*|}"

            if [ "${JOB_COMPLETE:-}" = "True" ]; then
              MIGRATION_RESULT="complete"
              break
            fi
            if [ "${JOB_FAILED:-}" = "True" ]; then
              MIGRATION_RESULT="failed"
              break
            fi

            if [ $((i % 30)) -eq 0 ]; then
              echo "Waiting for migration job $JOB_NAME (${i}s elapsed)..."
              kubectl -n cybercolors get "job.batch/$JOB_NAME" -o wide 2>/dev/null || true
              kubectl -n cybercolors get pods -l "job-name=$JOB_NAME" -o wide 2>/dev/null || true
            fi
            sleep 1
          done

          if [ "$MIGRATION_RESULT" != "complete" ]; then
            echo "Migration job $JOB_NAME did not complete successfully (result: $MIGRATION_RESULT)." >&2
            kubectl -n cybercolors describe "job.batch/$JOB_NAME" || true
            kubectl -n cybercolors get pods -l "job-name=$JOB_NAME" -o wide || true
            migration_container_logs
            exit 1
          fi

          migration_container_logs

  deploy:
    name: 6. Deploy with Argo CD
    runs-on: self-hosted
    dependencies:
      - build_frontend
      - build_indexer
      - build_embeddings
      - run_migrations
    steps:
      - type: script
        name: Patch Argo image tags and verify workloads
        script-content: |-
          #!/bin/bash
          set -euo pipefail

          ensure_kubectl_tools() {
            BIN_DIR="${HOME:-/tmp}/.local/bin"
            mkdir -p "$BIN_DIR"
            export PATH="$BIN_DIR:$PATH"

            if ! command -v kubectl >/dev/null 2>&1; then
              curl -fsSLo "$BIN_DIR/kubectl" "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              chmod +x "$BIN_DIR/kubectl"
            fi


          }

          ensure_kubectl_tools

          BACKEND_TAG="%job.build_backend.build.number%"
          FRONTEND_TAG="%job.build_frontend.build.number%"

          rm -rf cybercolors_bot
          git clone --depth 1 --branch master https://github.com/l1ghtny/cybercolors_bot.git cybercolors_bot

          cd cybercolors_bot
          INDEXER_HASH="$(
            git ls-files \
              docker/Dockerfile.indexer \
              pyproject.toml \
              uv.lock \
              scripts/run_ai_knowledge_worker.py \
              scripts/run_youtube_channel_worker.py \
              src/__init__.py \
              src/db \
              src/modules/__init__.py \
              src/modules/ai \
              src/modules/observability \
            | sort \
            | xargs sha256sum \
            | sha256sum \
            | cut -c1-16
          )"
          INDEXER_TAG="idx-$INDEXER_HASH"
          EMBEDDINGS_HASH="$(
            git ls-files \
              docker/Dockerfile.embeddings \
              pyproject.toml \
              uv.lock \
              src/__init__.py \
              src/modules/__init__.py \
              src/modules/ai/__init__.py \
              src/modules/ai/embedding_service.py \
              src/modules/ai/embeddings.py \
              src/modules/observability/prometheus.py \
            | sort \
            | xargs sha256sum \
            | sha256sum \
            | cut -c1-16
          )"
          EMBEDDINGS_TAG="emb-$EMBEDDINGS_HASH"
          cd ..

          python3 cybercolors_bot/scripts/deploy_cybercolors.py \
            --backend-tag "$BACKEND_TAG" \
            --frontend-tag "$FRONTEND_TAG" \
            --indexer-tag "$INDEXER_TAG" \
            --embeddings-tag "$EMBEDDINGS_TAG"
        format-stderr-as-error: true
