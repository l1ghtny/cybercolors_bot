# Pinned with grafana/alloy chart 1.11.0 (Alloy v1.18.0).
alloy:
  enableReporting: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_controller_name"]
          separator     = ";"
          regex         = "^;*([^;]+).*$"
          replacement   = "$1"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node_name"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        stage.static_labels {
          values = {
            cluster = "kosh-games",
          }
        }

        // This sidecar logs the complete Postgres pod status every few seconds.
        // It was almost half of cluster log volume and has no diagnostic value.
        stage.match {
          selector            = "{container=\"replication-cert-copy\"}"
          action              = "drop"
          drop_counter_reason = "replication_cert_copy_noise"
        }

        forward_to = [loki.write.persistent.receiver]
      }

      loki.write "persistent" {
        endpoint {
          url = "http://loki-v2-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  minReadySeconds: 10
  tolerations:
    - operator: Exists
      effect: NoSchedule

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prom-stack
