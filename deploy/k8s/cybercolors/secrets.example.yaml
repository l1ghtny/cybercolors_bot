apiVersion: v1
kind: Secret
metadata:
  name: cybercolors-app-secrets
  namespace: cybercolors
type: Opaque
stringData:
  DISCORD_BOT_TOKEN: ""
  TEST_GUILD_ID: ""
  DISCORD_CLIENT_ID: ""
  DISCORD_TEST_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
  DISCORD_REDIRECT_URI: "https://dashboard.modral.app/callback"
  OPENAI_API_KEY: ""
  OPENAI_ORG: ""
  # Google Cloud API key with YouTube Data API v3 enabled.
  YOUTUBE_DATA_API_KEY: ""
  MODAL_TOKEN_ID: ""
  MODAL_TOKEN_SECRET: ""
  TIMEZONEDB_KEY: ""
  # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # Keep old keys after the active key, comma-separated, during key rotation.
  DASHBOARD_SESSION_ENCRYPTION_KEYS: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: cybercolors-db-pgbackrest-secrets
  namespace: cybercolors
type: Opaque
stringData:
  # Keep the established cipher passphrase in the real Secret. Changing it in
  # place makes the existing pgBackRest repository unreadable.
  s3.conf: |
    [global]
    repo1-s3-key=
    repo1-s3-key-secret=
    repo1-cipher-type=aes-256-cbc
    repo1-cipher-pass=
