apiVersion: v1
kind: Service
metadata:
  name: cybercolors-bot-metrics
  namespace: cybercolors
  labels:
    monitoring.cybercolors.io/scrape: "true"
spec:
  selector:
    app: cybercolors-bot
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybercolors-indexer-worker
  namespace: cybercolors
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cybercolors-indexer-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cybercolors-indexer-worker
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - main-server
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload.cybercolors.dev/high-memory
                    operator: In
                    values:
                      - "true"
      containers:
        - name: worker
          image: localhost:32000/cybercolors-indexer:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/run_ai_knowledge_worker.py"]
          envFrom:
            - configMapRef:
                name: cybercolors-config
            - secretRef:
                name: cybercolors-app-secrets
                optional: true
          env:
            - name: PYTHONPATH
              value: /home/discord-bot
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cybercolors-db-pguser-backend
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cybercolors-db-pguser-backend
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
